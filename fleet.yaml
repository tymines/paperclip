# fleet.yaml — canonical Fleet lineup manifest for configuration review.
# The Fleet API's matching runtime definition lives in server/src/acp/canonical-fleet.ts.
# Operational agent records are reconciled to the presentation roster by name;
# neither definition creates, renames, pauses, resumes, archives, or terminates agents.

